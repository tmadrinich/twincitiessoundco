<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Production Tracker · Twin Cities Sound Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Bebas+Neue&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  /* Design tokens and base styles copied from the site stylesheet so this page matches.
     If you'd rather load the shared stylesheet, swap this block for your <link> and keep the .tk-* rules. */
  :root{
    --bg: #121212;
    --surface: #1C1B19;
    --line: #33302B;
    --brass: #8C6239;
    --brass-dim: #6B4A2A;
    --signal: #B98D52;
    --cream: #EDE6D8;
    --muted: #8F887C;
    --alert: #C0645A;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Archivo', system-ui, sans-serif;
    line-height: 1.5;
  }
  .mono{ font-family: 'Space Mono', monospace; }
  h1, h2, h3{
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0;
  }
  a{ color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline: 2px solid var(--signal);
    outline-offset: 3px;
  }
  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 20px; }
  .btn{
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-decoration: none;
    padding: 10px 18px;
    border: 1px solid var(--brass);
    color: var(--brass);
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn:hover{ background: var(--brass); color: var(--bg); }
  .btn-solid{ background: var(--brass); color: var(--bg); }
  .btn-solid:hover{ background: var(--brass-dim); border-color: var(--brass-dim); color: var(--cream); }

  /* ---------- header ---------- */
  .tk-header{
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .tk-nav{
    display: flex; align-items: center; justify-content: space-between;
    min-height: 64px; gap: 12px;
  }
  .tk-brand{
    text-decoration: none; color: var(--muted);
    font-size: 0.8rem; letter-spacing: 0.1em;
  }
  .tk-brand:hover{ color: var(--cream); }

  main{ padding: 40px 0 80px; }

  /* ---------- type ---------- */
  .tk-title{ font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1; color: var(--cream); }
  .tk-sub{ color: var(--muted); margin: 8px 0 28px; }
  .tk-back{
    display: inline-block; margin-bottom: 20px;
    font-family: 'Space Mono', monospace; font-size: 0.75rem;
    color: var(--muted); text-decoration: none; letter-spacing: 0.06em;
  }
  .tk-back:hover{ color: var(--cream); }
  .tk-h2{ font-size: 1.6rem; color: var(--cream); margin-bottom: 14px; }

  /* ---------- panels ---------- */
  .tk-panel{
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 22px;
    margin-bottom: 18px;
  }
  .tk-panel-head{ display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* ---------- fields ---------- */
  .tk-field{ display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tk-field label{
    font-family: 'Space Mono', monospace; font-size: 0.7rem;
    color: var(--muted); letter-spacing: 0.06em;
  }
  .tk-field input{
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--cream);
    font-family: 'Archivo', sans-serif;
    font-size: 16px;
    padding: 10px 12px;
    border-radius: 4px;
    width: 100%;
    min-width: 0;
    color-scheme: dark;
  }
  .tk-field input:focus{ border-color: var(--brass); outline: none; }
  .tk-grid-2{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tk-grid-3{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tk-span{ grid-column: 1 / -1; }
  @media (max-width: 480px){
    .tk-grid-2.stack{ grid-template-columns: 1fr; }
  }

  /* ---------- stats & bar ---------- */
  .tk-stats{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0 14px; }
  .tk-stat .n{ font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; line-height: 1; color: var(--cream); }
  .tk-stat .l{ font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.04em; }
  .tk-bar{ height: 6px; background: var(--line); overflow: hidden; }
  .tk-bar > div{ height: 100%; width: 0; background: var(--signal); transition: width 0.3s ease; }
  .tk-bar > div.over{ background: var(--alert); }

  .tk-badge{
    font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.04em;
    padding: 5px 12px; border-radius: 999px; border: 1px solid var(--signal); color: var(--signal);
    white-space: nowrap;
  }
  .tk-badge.over{ border-color: var(--alert); color: var(--alert); }

  /* ---------- project list ---------- */
  .tk-project{
    display: block; width: 100%; text-align: left; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: inherit;
    padding: 20px 22px; margin-bottom: 12px; font: inherit;
    transition: border-color 0.15s ease;
  }
  .tk-project:hover{ border-color: var(--brass); }
  .tk-project h3{ font-size: 1.7rem; color: var(--cream); }
  .tk-project .meta{ color: var(--muted); font-size: 0.9rem; margin: 2px 0 14px; }
  .tk-project .foot{ display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .tk-project .foot span.mono{ font-size: 0.75rem; color: var(--muted); }

  /* ---------- sessions ---------- */
  .tk-session{ border: 1px solid var(--line); background: var(--surface); padding: 18px 20px; margin-bottom: 10px; }
  .tk-session-head{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .tk-session-head h3{ font-size: 1.4rem; color: var(--cream); }
  .tk-pill{
    font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.04em;
    padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    background: transparent; border: 1px solid var(--line); color: var(--muted);
  }
  .tk-pill.scheduled{ border-color: var(--signal); color: var(--signal); }
  .tk-pill.done{ border-color: var(--brass); background: var(--brass); color: var(--bg); }
  .tk-linkbtn{
    background: none; border: 0; padding: 10px 0 0; cursor: pointer;
    font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.04em;
  }
  .tk-linkbtn:hover{ color: var(--alert); }

  .tk-add{ display: flex; gap: 10px; margin-top: 16px; }
  .tk-add .tk-field{ flex: 1; }

  .tk-msg{ font-family: 'Space Mono', monospace; font-size: 0.8rem; padding: 8px 0; color: var(--muted); }
  .tk-msg.error{ color: var(--alert); }
  .tk-empty{ color: var(--muted); padding: 24px 0; }
  .tk-login{ max-width: 380px; margin: 40px auto 0; }
  .tk-login .tk-field{ margin-bottom: 14px; }
</style>
</head>
<body>

<header class="tk-header">
  <div class="wrap tk-nav">
    <a class="tk-brand mono" href="/">Twin Cities Sound Co.</a>
    <button class="btn" id="signOut" type="button" hidden>Sign out</button>
  </div>
</header>

<main>
  <div class="wrap" id="app"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  // ---- Config ----
  var SUPABASE_URL = 'https://cgpdzgktbljgfphyahqr.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNncGR6Z2t0YmxqZ2ZwaHlhaHFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MjU4MDgsImV4cCI6MjEwMjUwMTgwOH0.hIS4XEtAP91QcZ0FWLvn6IKAar3eqdyBzZCxfT5Ccgg'; // Supabase > Project Settings > API > "anon public". Never use the service_role key here.

  var STATUSES = ['todo', 'scheduled', 'done'];
  var LABELS = { todo: 'To do', scheduled: 'Scheduled', done: 'Done' };

  var app = document.getElementById('app');
  var signOutBtn = document.getElementById('signOut');
  var sb = null;
  var projects = [];
  var allSessions = [];
  var cur = null; // { project, sessions }
  var listening = false;

  // ---- Helpers ----
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), props[k]);
      else n.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function fmt(n) { return (Math.round(n * 100) / 100).toString(); }
  function hhmm(t) { return t ? String(t).slice(0, 5) : ''; }
  function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
  function spanHours(a, b) {
    if (!a || !b) return null;
    var p = a.split(':'), q = b.split(':');
    var m = (+q[0] * 60 + +q[1]) - (+p[0] * 60 + +p[1]);
    if (m <= 0) m += 1440;
    return Math.round((m / 60) * 100) / 100;
  }
  function budgetInfo(price, rate, used) {
    var budget = rate > 0 ? price / rate : 0;
    var diff = budget - used;
    return {
      budget: budget,
      diff: diff,
      over: diff < 0,
      eff: used > 0 ? price / used : null,
      pct: budget ? Math.min(100, (used / budget) * 100) : 0
    };
  }
  function badgeText(rate, b) {
    if (!(rate > 0)) return 'Set a target rate';
    return b.over ? 'Over budget · ' + fmt(-b.diff) + ' hrs over' : 'Under budget · ' + fmt(b.diff) + ' hrs left';
  }
  function field(label, input, cls) {
    return el('div', { class: 'tk-field' + (cls ? ' ' + cls : '') }, [el('label', { text: label }), input]);
  }
  function fail(e) {
    var m = (e && e.message) ? e.message : 'Something went wrong.';
    var box = document.getElementById('status');
    if (box) { box.textContent = m; box.className = 'tk-msg error'; }
  }

  // ---- Boot / auth ----
  function boot() {
    if (!window.supabase || SUPABASE_ANON_KEY.indexOf('PASTE') === 0) {
      clear(app);
      app.appendChild(el('div', { class: 'tk-msg error', text: 'Add your Supabase anon key to tracker/index.html to turn this page on.' }));
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    signOutBtn.addEventListener('click', function () { sb.auth.signOut(); });
    sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') showLogin(); });
    sb.auth.getSession().then(function (r) {
      if (r.data && r.data.session) start(); else showLogin();
    });
  }

  function showLogin() {
    signOutBtn.hidden = true;
    clear(app);
    var email = el('input', { type: 'email', autocomplete: 'username', required: 'required' });
    var pass = el('input', { type: 'password', autocomplete: 'current-password', required: 'required' });
    var status = el('div', { class: 'tk-msg', id: 'status' });
    var form = el('form', { class: 'tk-login' }, [
      el('h1', { class: 'tk-title', text: 'Sign in' }),
      el('p', { class: 'tk-sub', text: 'Production tracker' }),
      field('Email', email),
      field('Password', pass),
      el('button', { class: 'btn btn-solid', type: 'submit', text: 'Sign in' }),
      status
    ]);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      status.textContent = 'Signing in…';
      sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value }).then(function (r) {
        if (r.error) { status.textContent = r.error.message; status.className = 'tk-msg error'; return; }
        start();
      });
    });
    app.appendChild(form);
  }

  function start() {
    signOutBtn.hidden = false;
    if (!listening) { window.addEventListener('hashchange', route); listening = true; }
    route();
  }

  function route() {
    var m = location.hash.match(/^#\/project\/([0-9a-fA-F-]+)/);
    if (m) showProject(m[1]); else showList();
  }

  // ---- Project list ----
  async function loadProjects() {
    var a = await sb.from('projects').select('*').order('created_at', { ascending: false });
    var b = await sb.from('sessions').select('project_id,hours,status');
    if (a.error) throw a.error;
    if (b.error) throw b.error;
    projects = a.data || [];
    allSessions = b.data || [];
  }

  async function showList() {
    clear(app);
    app.appendChild(el('div', { class: 'tk-msg', id: 'status', text: 'Loading…' }));
    try { await loadProjects(); } catch (e) { fail(e); return; }
    clear(app);

    app.appendChild(el('h1', { class: 'tk-title', text: 'Production tracker' }));
    app.appendChild(el('p', { class: 'tk-sub', text: 'Hours, sessions and budget for every project.' }));

    var title = el('input', { type: 'text', maxlength: '80', placeholder: 'Red Flowers (Single)' });
    var artist = el('input', { type: 'text', maxlength: '80', placeholder: 'Artist' });
    var price = el('input', { type: 'number', min: '0', step: '1', inputmode: 'decimal', placeholder: '0' });
    var rate = el('input', { type: 'number', min: '0', step: '1', inputmode: 'decimal', value: '20' });
    var status = el('div', { class: 'tk-msg', id: 'status' });
    var create = el('button', { class: 'btn btn-solid', type: 'button', text: 'Create project' });
    create.addEventListener('click', async function () {
      var t = title.value.trim();
      if (!t) { status.textContent = 'Give the project a name.'; status.className = 'tk-msg error'; return; }
      create.disabled = true;
      var r = await sb.from('projects').insert({
        title: t, artist: artist.value.trim() || null,
        price: num(price.value), target_rate: num(rate.value)
      }).select().single();
      create.disabled = false;
      if (r.error) { fail(r.error); return; }
      location.hash = '#/project/' + r.data.id;
    });

    app.appendChild(el('div', { class: 'tk-panel' }, [
      el('h2', { class: 'tk-h2', text: 'New project' }),
      el('div', { class: 'tk-grid-2' }, [
        field('Project', title, 'tk-span'),
        field('Artist', artist, 'tk-span'),
        field('Price ($)', price),
        field('Target rate ($/hr)', rate)
      ]),
      el('div', { style: 'margin-top:16px' }, [create]),
      status
    ]));

    if (!projects.length) {
      app.appendChild(el('div', { class: 'tk-empty', text: 'No projects yet. Create your first one above.' }));
      return;
    }

    projects.forEach(function (p) {
      var used = 0, done = 0, total = 0;
      allSessions.forEach(function (s) {
        if (s.project_id !== p.id) return;
        total++;
        if (s.status === 'done') done++;
        if (s.hours !== null && s.hours !== undefined) used += num(s.hours);
      });
      var b = budgetInfo(num(p.price), num(p.target_rate), used);
      var card = el('button', { class: 'tk-project', type: 'button' }, [
        el('div', { class: 'tk-panel-head' }, [
          el('h3', { text: p.title }),
          el('span', { class: 'tk-badge' + (b.over ? ' over' : ''), text: badgeText(num(p.target_rate), b) })
        ]),
        el('div', { class: 'meta', text: p.artist || 'No artist set' }),
        el('div', { class: 'tk-bar' }, [el('div', { class: b.over ? 'over' : '', style: 'width:' + b.pct + '%' })]),
        el('div', { class: 'foot' }, [
          el('span', { class: 'mono', text: fmt(used) + ' of ' + fmt(b.budget) + ' hrs' }),
          el('span', { class: 'mono', text: done + '/' + total + ' sessions done' })
        ])
      ]);
      card.addEventListener('click', function () { location.hash = '#/project/' + p.id; });
      app.appendChild(card);
    });
  }

  // ---- Project detail ----
  async function showProject(id) {
    clear(app);
    app.appendChild(el('div', { class: 'tk-msg', id: 'status', text: 'Loading…' }));
    var pr = await sb.from('projects').select('*').eq('id', id).maybeSingle();
    if (pr.error) { fail(pr.error); return; }
    if (!pr.data) { location.hash = '#/'; return; }
    var sr = await sb.from('sessions').select('*').eq('project_id', id)
      .order('sort_order', { ascending: true }).order('session_date', { ascending: true });
    if (sr.error) { fail(sr.error); return; }
    cur = { project: pr.data, sessions: sr.data || [], ui: {} };
    renderProject();
  }

  function renderProject() {
    var p = cur.project;
    var ui = cur.ui = { rows: {} };
    clear(app);

    app.appendChild(el('a', { class: 'tk-back', href: '#/', text: '← All projects' }));
    app.appendChild(el('h1', { class: 'tk-title', text: p.title }));
    app.appendChild(el('p', { class: 'tk-sub', text: p.artist || '' }));

    // Budget panel
    ui.badge = el('span', { class: 'tk-badge' });
    ui.price = el('input', { type: 'number', min: '0', step: '1', inputmode: 'decimal', value: String(num(p.price)) });
    ui.rate = el('input', { type: 'number', min: '0', step: '1', inputmode: 'decimal', value: String(num(p.target_rate)) });
    ui.nBudget = el('div', { class: 'n' });
    ui.nUsed = el('div', { class: 'n' });
    ui.nEff = el('div', { class: 'n' });
    ui.fill = el('div');
    ui.done = el('span', { class: 'mono', style: 'font-size:0.75rem;color:var(--muted)' });

    function saveProject() {
      p.price = Math.max(0, num(ui.price.value));
      p.target_rate = Math.max(0, num(ui.rate.value));
      refresh();
      sb.from('projects').update({ price: p.price, target_rate: p.target_rate }).eq('id', p.id).then(function (r) { if (r.error) fail(r.error); });
    }
    ui.price.addEventListener('change', saveProject);
    ui.rate.addEventListener('change', saveProject);

    app.appendChild(el('div', { class: 'tk-panel' }, [
      el('div', { class: 'tk-panel-head' }, [el('h2', { class: 'tk-h2', text: 'Budget' }), ui.badge]),
      el('div', { class: 'tk-grid-2' }, [field('Project price ($)', ui.price), field('Target rate ($/hr)', ui.rate)]),
      el('div', { class: 'tk-stats' }, [
        el('div', { class: 'tk-stat' }, [ui.nBudget, el('div', { class: 'l', text: 'budgeted hrs' })]),
        el('div', { class: 'tk-stat' }, [ui.nUsed, el('div', { class: 'l', text: 'hrs used' })]),
        el('div', { class: 'tk-stat' }, [ui.nEff, el('div', { class: 'l', text: 'effective $/hr' })])
      ]),
      el('div', { class: 'tk-bar' }, [ui.fill]),
      el('div', { style: 'margin-top:10px' }, [ui.done])
    ]));

    // Sessions
    app.appendChild(el('h2', { class: 'tk-h2', text: 'Sessions' }));
    ui.list = el('div');
    app.appendChild(ui.list);
    renderSessions();

    // Add session
    var newTitle = el('input', { type: 'text', maxlength: '80', placeholder: 'e.g. Mixing' });
    var addBtn = el('button', { class: 'btn btn-solid', type: 'button', text: 'Add session' });
    async function addSession() {
      var t = newTitle.value.trim();
      if (!t) return;
      var max = cur.sessions.reduce(function (m, s) { return Math.max(m, s.sort_order || 0); }, 0);
      var r = await sb.from('sessions').insert({ project_id: p.id, title: t, status: 'todo', sort_order: max + 1 }).select().single();
      if (r.error) { fail(r.error); return; }
      cur.sessions.push(r.data);
      newTitle.value = '';
      renderSessions();
    }
    addBtn.addEventListener('click', addSession);
    newTitle.addEventListener('keydown', function (e) { if (e.key === 'Enter') addSession(); });
    app.appendChild(el('div', { class: 'tk-add' }, [field('New session', newTitle), el('div', { style: 'align-self:flex-end' }, [addBtn])]));

    app.appendChild(el('div', { class: 'tk-msg', id: 'status' }));

    var del = el('button', { class: 'tk-linkbtn', type: 'button', text: 'Delete this project' });
    del.addEventListener('click', async function () {
      if (!confirm('Delete “' + p.title + '” and all of its sessions?')) return;
      var r = await sb.from('projects').delete().eq('id', p.id);
      if (r.error) { fail(r.error); return; }
      location.hash = '#/';
    });
    app.appendChild(el('div', { style: 'margin-top:32px' }, [del]));

    refresh();
  }

  function renderSessions() {
    var ui = cur.ui;
    clear(ui.list);
    ui.rows = {};
    if (!cur.sessions.length) {
      ui.list.appendChild(el('div', { class: 'tk-empty', text: 'No sessions yet. Add the first one below.' }));
    }
    cur.sessions.forEach(function (s) { ui.list.appendChild(sessionCard(s)); });
    refresh();
  }

  function patchSession(s, patch) {
    Object.keys(patch).forEach(function (k) { s[k] = patch[k]; });
    refresh();
    sb.from('sessions').update(patch).eq('id', s.id).then(function (r) { if (r.error) fail(r.error); });
  }

  function sessionCard(s) {
    var ref = cur.ui.rows[s.id] = {};

    var pill = el('button', { class: 'tk-pill ' + s.status, type: 'button', text: LABELS[s.status] });
    pill.addEventListener('click', function () {
      var next = STATUSES[(STATUSES.indexOf(s.status) + 1) % STATUSES.length];
      pill.className = 'tk-pill ' + next;
      pill.textContent = LABELS[next];
      patchSession(s, { status: next });
    });

    var date = el('input', { type: 'date', value: s.session_date || '' });
    date.addEventListener('change', function () { patchSession(s, { session_date: date.value || null }); });

    var start = el('input', { type: 'time', value: hhmm(s.start_time) });
    var end = el('input', { type: 'time', value: hhmm(s.end_time) });
    var hrs = el('input', { type: 'number', min: '0', step: '0.25', inputmode: 'decimal', placeholder: '0' });
    if (s.hours !== null && s.hours !== undefined) hrs.value = String(num(s.hours));
    ref.hrs = hrs;

    function saveTimes() {
      var patch = { start_time: start.value || null, end_time: end.value || null };
      var h = spanHours(start.value, end.value);
      if (h !== null) { patch.hours = h; hrs.value = String(h); }
      patchSession(s, patch);
    }
    start.addEventListener('change', saveTimes);
    end.addEventListener('change', saveTimes);
    hrs.addEventListener('change', function () {
      var v = parseFloat(hrs.value);
      patchSession(s, { hours: isNaN(v) ? null : Math.max(0, v) });
    });

    var notes = el('input', { type: 'text', maxlength: '300', placeholder: 'Notes', value: s.notes || '' });
    notes.addEventListener('change', function () { patchSession(s, { notes: notes.value }); });

    var del = el('button', { class: 'tk-linkbtn', type: 'button', text: 'Remove session' });
    del.addEventListener('click', async function () {
      if (!confirm('Remove “' + s.title + '”?')) return;
      var r = await sb.from('sessions').delete().eq('id', s.id);
      if (r.error) { fail(r.error); return; }
      cur.sessions = cur.sessions.filter(function (x) { return x.id !== s.id; });
      renderSessions();
    });

    return el('div', { class: 'tk-session' }, [
      el('div', { class: 'tk-session-head' }, [el('h3', { text: s.title }), pill]),
      el('div', { class: 'tk-grid-3' }, [
        field('Date', date, 'tk-span'),
        field('Start', start),
        field('End', end),
        field('Hours', hrs)
      ]),
      el('div', { style: 'margin-top:12px' }, [field('Notes', notes)]),
      del
    ]);
  }

  // Recompute budget numbers without rebuilding the page (keeps focus while tabbing through fields)
  function refresh() {
    if (!cur || !cur.ui || !cur.ui.badge) return;
    var p = cur.project, ui = cur.ui;
    var used = 0, done = 0;
    cur.sessions.forEach(function (s) {
      if (s.hours !== null && s.hours !== undefined) used += num(s.hours);
      if (s.status === 'done') done++;
    });
    var b = budgetInfo(num(p.price), num(p.target_rate), used);
    ui.nBudget.textContent = fmt(b.budget);
    ui.nUsed.textContent = fmt(used);
    ui.nEff.textContent = b.eff === null ? '—' : '$' + fmt(b.eff);
    ui.badge.textContent = badgeText(num(p.target_rate), b);
    ui.badge.className = 'tk-badge' + (b.over || !(num(p.target_rate) > 0) ? ' over' : '');
    ui.fill.style.width = b.pct + '%';
    ui.fill.className = b.over ? 'over' : '';
    ui.done.textContent = done + '/' + cur.sessions.length + ' sessions done';
  }

  boot();
})();
</script>
</body>
</html>
