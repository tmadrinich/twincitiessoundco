<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artists — Twin Cities Sound Company</title>
<meta name="description" content="Artists represented by Twin Cities Sound Company across the Twin Cities and Midwest music scene.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>

  <section class="hero wrap" style="border-bottom:1px solid var(--line); padding-bottom: 48px;">
    <div class="section-label mono">ARTISTS</div>
    <h1 class="section-title" style="margin-bottom: 16px;">Who we represent</h1>
    <p class="hero-tag">Original artists, cover bands, and working musicians we handle booking, branding, and career development for across the Twin Cities and Midwest.</p>
  </section>

  <section class="wrap">
    <!-- TODO: artist roster — cards or profiles for Whiskey Peddler, Matt Mueller, etc. -->
    <p style="color: var(--muted);">Artist roster goes here.</p>
  </section>

  <div id="footer-placeholder"></div>

</main>

<script>
  async function loadPartial(placeholderId, url) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Failed to load ' + url);
      document.getElementById(placeholderId).outerHTML = await res.text();
    } catch (err) {
      console.error(err);
    }
  }
  loadPartial('header-placeholder', '/partials/header.html');
  loadPartial('footer-placeholder', '/partials/footer.html');
</script>

</body>
</html>
