<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services — Twin Cities Sound Company</title>
<meta name="description" content="Artist representation, brand and digital services, and a recording and production network from Twin Cities Sound Company.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="header-placeholder"></div>

<main>

  <section class="hero wrap" style="border-bottom:1px solid var(--line); padding-bottom: 48px;">
    <div class="section-label mono">SERVICES</div>
    <h1 class="section-title" style="margin-bottom: 16px;">What we do</h1>
    <p class="hero-tag">Representation, brand and digital support, and a recording network — customized to what each artist actually needs.</p>
  </section>

  <section class="wrap">
    <!-- TODO: Representation — booking, contracting, career development -->
    <p style="color: var(--muted);">Representation section goes here.</p>
  </section>

  <section class="wrap">
    <!-- TODO: Brand & digital — websites, content, EPKs, social -->
    <p style="color: var(--muted);">Brand &amp; digital section goes here.</p>
  </section>

  <section class="wrap">
    <!-- TODO: Recording network — studio, producer, engineer connections -->
    <p style="color: var(--muted);">Recording network section goes here.</p>
  </section>

  <div id="footer-placeholder"></div>

</main>

<script>
  async function loadPartial(placeholderId, url) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Failed to load ' + url);
      document.getElementById(placeholderId).outerHTML = await res.text();
    } catch (err) {
      console.error(err);
    }
  }
  loadPartial('header-placeholder', '/partials/header.html');
  loadPartial('footer-placeholder', '/partials/footer.html');
</script>

</body>
</html>
